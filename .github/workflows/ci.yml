name: Validate Kilo harness

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  smoke:
    name: Sandbox and Kilo (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Install tested runtimes
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/install-nono.sh
          echo "$PWD/.tools/bin" >> "$GITHUB_PATH"
          bash scripts/install-kilo-ci.sh
      - name: Validate package and profile
        run: python3 scripts/validate.py --nono nono
      - name: Check actual sandbox and Kilo runtime
        run: python3 tests/smoke.py
