name: Validate Kilo harness

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  dashboard:
    name: Dashboard (Node ${{ matrix.node }})
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - name: Install dashboard dependencies
        run: npm ci
      - name: Test policies, HTTP API and terminal streaming
        run: npm test

  smoke:
    name: Sandbox and Kilo (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Install tested runtimes
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/install-nono.sh
          echo "$PWD/.tools/bin" >> "$GITHUB_PATH"
          bash scripts/install-kilo-ci.sh
      - name: Validate package and profile
        run: python3 scripts/validate.py --nono nono
      - name: Check actual sandbox and Kilo runtime
        run: python3 tests/smoke.py
